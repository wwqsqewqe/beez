*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#080808;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;height:100%;overflow:hidden}
#network{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none!important}
.app{position:relative;z-index:10;display:flex;height:100vh;width:100%}
.sidebar{width:58px;background:#0c0c0c;border-right:1px solid #1c1c1c;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;flex-shrink:0;z-index:20}
.nav-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#666;cursor:pointer;border:none;background:transparent;font-size:17px;transition:.15s;user-select:none}
.nav-btn:hover,.nav-btn.active{background:#1a1a1a;color:#fff}
.spacer{flex:1}
.main{flex:1;padding:20px 28px;overflow-y:auto;height:100vh;position:relative;z-index:15}
.page{display:none}.page.active{display:block}
.home-center{max-width:680px;margin:50px auto 0;text-align:center}
.logo{font-size:64px;font-weight:300;letter-spacing:10px;margin-bottom:6px;color:#f0f0f0}
.tagline{color:#777;font-size:14px;margin-bottom:28px}
.search-wrap{position:relative;margin-bottom:18px}
.search-input{width:100%;background:#111;border:1px solid #2a2a2a;border-radius:40px;padding:14px 20px 14px 46px;color:#eee;font-size:15px;outline:none}
.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#555;pointer-events:none}
.engines{display:flex;justify-content:center;gap:7px;margin-bottom:24px;flex-wrap:wrap}
.engine{background:#141414;border:1px solid #2a2a2a;color:#999;padding:5px 13px;border-radius:16px;font-size:12px;cursor:pointer;user-select:none}
.engine.active{background:#222;color:#fff;border-color:#444}
.apps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:40px}
.app-btn{background:#141414;border:1px solid #2a2a2a;color:#ccc;padding:7px 14px;border-radius:16px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.app-btn span{font-size:10px;color:#666;background:#1a1a1a;padding:1px 5px;border-radius:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;max-width:860px;margin:0 auto}
.card{background:#111;border:1px solid #222;border-radius:12px;padding:20px 16px;cursor:pointer;text-align:left;transition:.15s;user-select:none}
.card:hover{background:#161616;border-color:#333}
.card-icon{width:32px;height:32px;background:#1a1a1a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px}
.card h3{font-size:15px;margin-bottom:3px}.card p{font-size:12px;color:#666}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.badge{background:#1a1a1a;color:#888;font-size:12px;padding:2px 9px;border-radius:12px}
.game-search-bar{display:flex;align-items:center;gap:10px;margin:0 0 18px;max-width:640px}
.game-search{flex:1;background:#111;border:1px solid #2a2a2a;border-radius:24px;padding:12px 18px;color:#eee;font-size:14px;outline:none;min-width:0}
.game-search:focus{border-color:#444}
.search-games-btn{background:#e0a000;color:#111;border:none;border-radius:24px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.search-games-btn:hover{background:#f0b010}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.game-card{background:#111;border:1px solid #222;border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s;user-select:none}
.game-card:hover{border-color:#3a3a3a;transform:translateY(-2px)}
.game-thumb{height:90px;background:#181818;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.game-thumb img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.game-thumb .name-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:10px 8px;text-align:center;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#eee;font-size:12px;font-weight:600;line-height:1.25;word-break:break-word}
.game-num{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);font-size:10px;padding:1px 6px;border-radius:4px;color:#bbb;z-index:2}
.game-info{padding:8px 10px}
.game-title{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proxy-center{max-width:520px;margin:60px auto;text-align:center}
.proxy-logo{font-size:48px;font-weight:300;letter-spacing:6px;margin-bottom:6px}
.loading-msg{color:#888;font-size:13px;padding:20px;text-align:center}
</style></head>

document.querySelectorAll('.engine').forEach(function(el){el.onclick=function(){document.querySelectorAll('.engine').forEach(function(e){e.classList.remove('active')});el.classList.add('active');eng=el.getAttribute('data-engine')}});
function doSearch() {
  var q = document.getElementById('mainSearch').value.trim();
  if (!q) return;

  // Always treat it as a URL or search through proxy
  var url = q.indexOf('http') === 0 ? q : 'https://' + q;
  doProxy(url);
}

async function doProxy(urlFromSearch) {
  let url = urlFromSearch || document.getElementById('proxyInput')?.value?.trim();
  if (!url) return;

  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    url = 'https://' + url;
  }

  // Switch to proxy page
  showPage('proxy');

  const proxyPage = document.getElementById('proxy');
  proxyPage.innerHTML = `
    <div style="display:flex;flex-direction:column;height:100vh;background:#000;">
      <div style="padding:10px 14px;background:#111;display:flex;gap:10px;align-items:center;border-bottom:1px solid #222;">
        <button onclick="location.reload()" style="background:#222;color:white;border:none;padding:7px 14px;border-radius:6px;cursor:pointer;">← Back</button>
        <input id="proxyBar" value="${url}" style="flex:1;background:#0c0c0c;border:1px solid #333;color:#eee;padding:8px 12px;border-radius:8px;outline:none;font-size:14px;">
        <button id="proxyGoBtn" style="background:#e0a000;color:#111;border:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;">Go</button>
      </div>
      <div id="frameBox" style="flex:1;display:flex;align-items:center;justify-content:center;color:#888;font-size:15px;">
        Starting proxy...
      </div>
    </div>
  `;

  try {
    // Register service worker
    await navigator.serviceWorker.register('/beez/sw.js');
    await navigator.serviceWorker.ready;

    const { ScramjetController } = $scramjetLoadController();

    if (!window.scramjet) {
      window.scramjet = new ScramjetController({
        prefix: '/beez/scramjet/',
        files: {
     wasm: '/beez/scramjet/scramjet.wasm',
     all: '/beez/scramjet/scramjet.js'        }
      });
      await window.scramjet.init();
    }

    const frame = window.scramjet.createFrame();
    const box = document.getElementById('frameBox');
    box.innerHTML = '';
    box.appendChild(frame.frame);

    frame.frame.style.width = '100%';
    frame.frame.style.height = '100%';
    frame.frame.style.border = 'none';

    frame.go(url);

    // Address bar controls
    document.getElementById('proxyGoBtn').onclick = () => {
      let newUrl = document.getElementById('proxyBar').value.trim();
      if (!newUrl.startsWith('http')) newUrl = 'https://' + newUrl;
      frame.go(newUrl);
    };

    document.getElementById('proxyBar').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('proxyGoBtn').click();
    });

  } catch (err) {
    console.error(err);
    document.getElementById('frameBox').innerHTML = `
      <div style="text-align:center;color:#ff5555;padding:40px;">
        <h3>Proxy Error</h3>
        <p style="margin-top:12px;">${err.message}</p>
        <p style="margin-top:20px;font-size:13px;color:#888;">Press F12 → Console for full error</p>
      </div>
    `;
  }
}
document.getElementById('proxyInput').onkeydown=function(e){if(e.key==='Enter')doProxy()};
document.getElementById('proxyGo').onclick=function(e){e.preventDefault();doProxy()};
function playGame(file){var msg=document.getElementById('loadMsg');msg.style.display='block';var url='https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/'+encodeURIComponent(file+'.html')+'?t='+Date.now();
fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(t){msg.style.display='none';var w=window.open('about:blank','_blank');if(w){w.document.open();w.document.write(t);w.document.close()}else alert('Allow popups')}).catch(function(e){msg.style.display='none';alert('Failed: '+e.message)})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&'+'amp;','<':'&'+'lt;','>':'&'+'gt;','"':'&'+'quot;',"'":'&#39;'}[c]})}
function nameThumb(n){return '<div class="name-fallback">'+escapeHtml(n)+'</div>'}
var filtered=allGames.slice(),idx=0,batch=60,grid=document.getElementById('gamesGrid');
function applyFilter(q){q=(q||'').trim().toLowerCase();filtered=!q?allGames.slice():allGames.filter(function(g){return g.name.toLowerCase().indexOf(q)!==-1||g.file.toLowerCase().indexOf(q)!==-1});reset()}
function render(){var end=Math.min(idx+batch,filtered.length);for(var i=idx;i<end;i++){(function(i){var g=filtered[i],btn=document.createElement('div');btn.className='game-card';
var thumb=g.cover?'<img src="'+g.cover+'" alt="" loading="lazy" onerror="this.style.display=\'none\';var el=this.parentNode.querySelector(\'.name-fallback\');if(el)el.style.display=\'flex\'">'+nameThumb(g.name).replace('class="name-fallback"','class="name-fallback" style="display:none"'):nameThumb(g.name);
btn.innerHTML='<div class="game-thumb"><span class="game-num">#'+(i+1)+'</span>'+thumb+'</div><div class="game-info"><div class="game-title">'+escapeHtml(g.name)+'</div></div>';
btn.onclick=function(){playGame(g.file)};grid.appendChild(btn)})(i)}idx=end;document.getElementById('gameCount').textContent=filtered.length}
function reset(){grid.innerHTML='';idx=0;render()}
document.getElementById('gamesSearchBtn').onclick=function(){applyFilter(document.getElementById('gameSearch').value)};
document.getElementById('proxyGo').onclick = function(e){ e.preventDefault(); doProxy(); };
document.getElementById('proxyInput').onkeydown = function(e){ if(e.key === 'Enter') doProxy(); };
document.getElementById('gameSearch').onkeydown=function(e){if(e.key==='Enter')applyFilter(this.value)};
document.getElementById('gameSearch').oninput=function(){applyFilter(this.value)};
document.getElementById('btn-games').addEventListener('click',function(){setTimeout(function(){var s=document.getElementById('gameSearch');if(s)s.focus()},50)});
document.getElementById('main').onscroll=function(){var m=this;if(m.scrollTop+m.clientHeight>m.scrollHeight-500&&idx<filtered.length)render()};
document.getElementById('gameCount').textContent=allGames.length;render();
</script></body></html>
